<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Test Drive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm p-4 border-0">
                    <h3 class="text-center mb-4 fw-bold">Book a Test Drive</h3>
                    <form class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">First name</label>
                            <input type="text" class="form-control" placeholder="First name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Last name</label>
                            <input type="text" class="form-control" placeholder="Last name" required>
                        </div>
                        <div class="col-12">
                            <label for="inputEmail4" class="form-label">Email</label>
                            <input type="email" class="form-control" id="inputEmail4" placeholder="name@example.com" required>
                        </div>
                        <div class="col-12">
                            <label for="inputPhone" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="inputPhone" placeholder="+962 7X XXX XXXX" required>
                        </div>
                                                <div class="col-12">
                            <label for="inputState" class="form-label">Car Model</label>
                            <select id="inputState" class="form-select">
                                <option selected disabled value="">Choose a model...</option>
                                <optgroup label="M Power Series">
                                    <option>M2</option>
                                    <option>M3</option>
                                    <option>M4</option>
                                    <option>M5</option>
                                    <option>M8</option>
                                </optgroup>
                                <optgroup label="X Series (SUVs)">
                                    <option>X3</option>
                                    <option>X4</option>
                                    <option>X5</option>
                                    <option>X6</option>
                                    <option>X7</option>
                                </optgroup>
                                <optgroup label="Sedans">
                                    <option>3 Series</option>
                                    <option>4 Series</option>
                                    <option>5 Series</option>
                                    <option>7 Series</option>
                                    <option>8 Series</option>
                                </optgroup>
                            </select>
                        </div>
                        <div class="col-12 text-center mt-4">
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Booking</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
