<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nike Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white ">
  <div class="container" style="max-width: 850px;">
        <div class="text-center mb-4">
      <img src="../_nike.png" alt="Logo" class="img-fluid" style="width: 70px;">
    </div>
    <div class="row g-3">
            <div class="col-md-6">
        <div class="position-relative h-100">
          <img src="../niketask/Screenshot from 2026-08-23 02-05-01.png" class="w-100 h-100 object-fit-cover" alt="Athlete">
          
          <div class="position-absolute bottom-0 start-0 p-4 text-white">
            <h1 class="fw-bold text-uppercase fst-italic mb-2 lh-1">
              REP YOUR<br>SCHOOL
            </h1>
            <p class="small mb-3">
              Get game day ready with the College Vomero 18 — now in your team's colors.
            </p>
            <a href="#" class="btn btn-light rounded-pill  fw-bold text-dark">
              Shop
            </a>
          </div>
        </div>
      </div>
      <div class="col-md-6 d-flex flex-column gap-3">
        <div>
          <img src="../niketask/Screenshot from 2026-08-23 02-05-27.png" class="img-fluid w-100" alt="Shoes">
        </div>
        <div>
          <img src="../niketask/Screenshot from 2026-08-23 02-05-38.png" class="img-fluid w-100" alt="Athlete">
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
