<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Login</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container min-vh-100 d-flex align-items-center justify-content-center p-3 p-md-4">
    <div class="card border-0 shadow-lg overflow-hidden w-100" style="max-width: 1000px;">
      <div class="row g-0">
                <div class="col-12 col-md-6 d-flex">
          <img src="../bootsraptask/GettyImages-1178589923-forensics-assesor.webp" 
               class="w-100 h-100 object-fit-cover" 
               style="min-height: 240px; max-height: 600px;" 
               alt="Login Banner">
        </div>
        <div class="col-12 col-md-6 bg-white p-4 p-sm-5 d-flex flex-column justify-content-between">
                    <div class="text-center mb-4 mt-2 mt-md-3">
            <h5 class="text-secondary fw-bold text-uppercase" style="letter-spacing: 2px;">Account Login</h5>
          </div>
          <form class="w-100 px-lg-2">
            <div class="row g-3 g-md-4 mb-4">
              <div class="col-12 col-sm-6">
                <input type="text" 
                       class="form-control border-0 border-bottom " 
                       placeholder="User name" 
                       required>
              </div>
              <div class="col-12 col-sm-6">
                <input type="password" 
                       class="form-control border-0 border-bottom " 
                       placeholder="Password" 
                       required>
              </div>
            </div>
            <div class="d-grid mb-3 pt-2">
              <button type="submit" class="btn btn-success fw-bold fs-6">SIGN IN</button>
            </div>

            <div class="text-center">
              <span class="text-muted small">
                Forgot <a href="#" class="text-success ">User name / password?</a>
              </span>
            </div>
          </form>
          <div class="text-center mt-4 mt-md-5 mb-2">
            <a href="#" class="text-success fw-bold ">SIGN UP</a>
          </div>

        </div>

      </div>
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
